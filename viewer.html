<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LiveAudio Translate - Segundo Monitor / Ventana Independiente</title>
  <link rel="stylesheet" href="viewer.css">
</head>
<body>
  <div class="viewer-container">
    <!-- Barra superior de control -->
    <header class="viewer-header">
      <div class="header-left">
        <span class="status-indicator active">
          <span class="pulse-dot"></span>
          <span id="connectionStatus">En vivo (Segundo Monitor)</span>
        </span>
        <span class="provider-badge" id="providerBadge">Groq Whisper Turbo</span>
      </div>

      <div class="header-controls">
        <button id="btnCaptureDesktop" class="btn-ctrl btn-highlight" title="Selecciona qué ventana o pantalla quieres escuchar (Zoom, Meet, otra ventana de Chrome, etc.)">
          🎙️ <span id="desktopBtnText">Escuchar otra ventana / Zoom</span>
        </button>
        <button id="btnToggleMode" class="btn-ctrl" title="Alternar modo bilingüe / solo español">
          🔀 <span id="modeText">Bilingüe (EN + ES)</span>
        </button>
        <button id="btnFontDec" class="btn-ctrl" title="Reducir tamaño">A-</button>
        <button id="btnFontInc" class="btn-ctrl" title="Aumentar tamaño">A+</button>
        <button id="btnPip" class="btn-ctrl" title="Fijar siempre visible (Picture-in-Picture)">📌 Siempre al frente</button>
        <button id="btnFullscreen" class="btn-ctrl" title="Pantalla completa">⛶ Pantalla Completa</button>
      </div>
    </header>

    <!-- Tarjeta Principal de Subtítulo en Vivo (Gigante y Claro) -->
    <main class="live-card">
      <div class="live-header">
        <span class="live-tag">Traducción Actual</span>
        <span class="live-clock" id="liveClock">--:--:--</span>
      </div>

      <div class="subtitles-box">
        <!-- Subtítulo en Español (Prominente) -->
        <div class="line-es" id="lineEs">
          <span class="tag-lang tag-es">ES</span>
          <p class="text-main" id="textEs">Esperando audio para traducir...</p>
        </div>

        <!-- Subtítulo en Inglés (Original) -->
        <div class="line-en" id="lineEn">
          <span class="tag-lang tag-en">EN</span>
          <p class="text-sub" id="textEn">Waiting for English audio speech...</p>
        </div>
      </div>
    </main>

    <!-- Historial / Flujo de Transcripción Continua -->
    <section class="stream-section">
      <div class="stream-header">
        <span class="stream-title">Flujo Completo de la Sesión</span>
        <div class="stream-actions">
          <label class="autoscroll-label">
            <input type="checkbox" id="chkAutoScroll" checked> Auto-scroll
          </label>
          <button id="btnCopyStream" class="btn-action">📋 Copiar Todo</button>
          <button id="btnExportStream" class="btn-action">💾 Exportar .TXT</button>
          <button id="btnClearStream" class="btn-action btn-danger">🗑️ Limpiar</button>
        </div>
      </div>

      <div class="stream-list" id="streamList">
        <div class="stream-empty">Las frases traducidas se acumularán aquí cronológicamente...</div>
      </div>
    </section>
  </div>

  <script src="viewer.js"></script>
</body>
</html>
